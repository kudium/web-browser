<main><header><div><span class="eyebrow">Listen · local voices</span><h1 id="title">Listen to this page</h1><p id="meta" class="muted"></p></div><span class="pill">Free · on device</span></header>
<section class="card"><div class="grid"><label>Voice<select id="voice" aria-label="Voice"></select></label><label>Speed<select id="speed" aria-label="Playback speed"><option value="0.75">0.75× · relaxed</option><option value="1" selected>1× · normal</option><option value="1.25">1.25× · brisk</option><option value="1.5">1.5× · fast</option><option value="2">2× · very fast</option></select></label></div>
<div class="row" style="margin:16px 0"><button id="previous" aria-label="Previous paragraph">←</button><button id="play" class="primary grow">Play</button><button id="next" aria-label="Next paragraph">→</button><button id="stop">Stop</button></div>
<label>Reading progress<input id="progress" type="range" min="0" max="0" value="0" aria-label="Reading progress"></label><p id="status" class="muted" role="status" aria-live="polite">Choose a voice, then press Play.</p></section>
<p id="error" class="error" role="alert"></p><div class="row"><button id="refresh">Refresh / use selected text</button><a id="source" class="muted">Original page ↗</a></div>
<p class="muted" id="limit"></p><h2 style="margin-top:20px">Follow along</h2><div id="transcript" class="list"></div><p class="muted">Uses voices installed on your Mac. No account or cloud upload. Select text on the page, then refresh to listen to just that passage.</p></main>
