<!doctype html><html><head><meta charset="utf-8"><title>Settings</title><link rel="stylesheet" href="/style.css"></head>
<body><h1>Settings</h1>
<label for="month">Report month</label> <select id="month"><option>September</option><option>October</option><option>November</option></select><br>
<label><input id="notify" type="checkbox"> Email notifications</label><br>
<button id="save">Save</button> <p id="status">Unsaved</p>
<nav><a href="/dashboard.html">Back to dashboard</a></nav>
<script>document.getElementById('save').onclick=()=>{document.getElementById('status').textContent='Saved '+document.getElementById('month').value+(document.getElementById('notify').checked?' with notifications':'');};</script>
</body></html>
