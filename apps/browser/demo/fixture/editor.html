<!doctype html><html><head><meta charset="utf-8"><title>Editor</title><link rel="stylesheet" href="/style.css"></head>
<body><h1>Editor</h1><p>This page registers a beforeunload handler once the draft changes.</p>
<textarea id="draft" rows="6" cols="60">Draft</textarea><p id="state">Clean</p>
<nav><a href="/dashboard.html">Leave to dashboard</a></nav>
<script>
let dirty=false;
document.getElementById('draft').addEventListener('input',()=>{dirty=true;document.getElementById('state').textContent='Dirty';});
window.addEventListener('beforeunload',(event)=>{if(!dirty&&!location.hash.includes('always'))return;event.preventDefault();event.returnValue='';});
</script></body></html>
