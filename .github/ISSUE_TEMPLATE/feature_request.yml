name: Feature request
description: Suggest an improvement to Kudium.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Describe the problem you want to solve and avoid including personal or sensitive data.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who is affected and a concrete example of the current difficulty.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe how you would expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional mockups, examples or related issues.
