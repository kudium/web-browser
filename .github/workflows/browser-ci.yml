name: Browser checks
on:
  pull_request:
    paths:
      ["apps/browser/**", ".github/workflows/browser-*.yml", "scripts/ci/**"]
  push:
    branches: [main]
    paths:
      ["apps/browser/**", ".github/workflows/browser-*.yml", "scripts/ci/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Browser checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --roots src
