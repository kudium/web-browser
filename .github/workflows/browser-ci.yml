name: Browser checks
on:
  pull_request:
    paths:
      ["apps/browser/**", ".github/workflows/browser-*.yml", "scripts/ci/**", "scripts/local-release*", "package.json"]
  push:
    branches: [main]
    paths:
      ["apps/browser/**", ".github/workflows/browser-*.yml", "scripts/ci/**", "scripts/local-release*", "package.json"]
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also run paid hosted macOS checks"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Browser checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_macos && '["ubuntu-latest","windows-latest","macos-15-intel"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - run: npm install --global npm@12.2.0
      - name: Use canonical Windows temporary paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: npm ci
      - run: node --test ../../scripts/local-release.test.mjs ../../scripts/ci/select-browser-release.test.mjs
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --roots src --config .erb/configs/jest.ci.cjs
