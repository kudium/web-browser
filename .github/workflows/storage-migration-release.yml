name: Storage migration release gate
on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Approved native signed-upgrade workflow run containing the evidence bundle
        required: true
        type: string
      evidence_artifact:
        description: Artifact containing evidence.json, installers and hashed scenario receipts
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - run: npm install --global npm@12.2.0
      - run: npm ci
        working-directory: apps/browser
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.evidence_artifact }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: migration-release-evidence
      - run: npm run release:verify-migrations -- ../../migration-release-evidence/evidence.json
        working-directory: apps/browser
