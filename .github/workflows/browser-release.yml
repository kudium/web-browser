name: Browser release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing main-branch tag: v1.1.0 or v1.1.0-beta.1"
        required: true
        type: string
      targets:
        description: "Platforms to release (macOS includes Apple Silicon and Intel)"
        default: macos
        type: choice
        options: [macos, all]
      publish:
        description: "Approve signed publication (stable releases require this manual run)"
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: browser-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      channel: ${{ steps.target.outputs.channel }}
      publish: ${{ steps.target.outputs.publish }}
      targets: ${{ steps.target.outputs.targets }}
      matrix: ${{ steps.target.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag and approval
        id: target
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          APPROVED: ${{ inputs.publish }}
          EVENT: ${{ github.event_name }}
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          git rev-parse --verify "refs/tags/$TAG"
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main
          if [[ "$EVENT" == workflow_dispatch ]]; then test "$GITHUB_REF" = refs/heads/main; fi
          channel=stable
          publish=false
          if [[ "$TAG" == *-beta.* ]]; then channel=beta; publish=true; fi
          if [[ "$EVENT" == workflow_dispatch ]]; then publish="$APPROVED"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          node scripts/ci/browser-release-targets.mjs "$TARGETS" >> "$GITHUB_OUTPUT"
      - name: Check publication credentials before building
        if: steps.target.outputs.publish == 'true'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          TARGETS: ${{ steps.target.outputs.targets }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          names="MAC_CSC_LINK MAC_CSC_KEY_PASSWORD RELEASE_PUBLISH_TOKEN"
          if test "$TARGETS" = all; then names="$names WIN_CSC_LINK WIN_CSC_KEY_PASSWORD"; fi
          if test -n "$APPLE_API_KEY"; then
            names="$names APPLE_API_KEY_ID APPLE_API_ISSUER"
          else
            names="$names APPLE_ID APPLE_ID_PASS APPLE_TEAM_ID"
          fi
          for name in $names; do
            if test -z "${!name}"; then echo "::error::Missing GitHub Actions secret: $name"; exit 1; fi
          done
  build:
    needs: prepare
    name: Build ${{ matrix.platform }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_SIGNING_REQUIRED: ${{ needs.prepare.outputs.publish }}
      CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.MAC_CSC_LINK || matrix.platform == 'win32' && secrets.WIN_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win32' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - run: npm install --global npm@12.2.0
      - name: Use canonical Windows temporary paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: npm ci
        working-directory: apps/browser
      - run: npx tsc --noEmit && npm test -- --runInBand --roots src --config .erb/configs/jest.ci.cjs
        working-directory: apps/browser
      - run: node scripts/ci/prepare-browser-release.mjs "$TAG"
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
      - run: npm run package:web -- --${{ matrix.flag }} --${{ matrix.arch }}
        working-directory: apps/browser
      - name: Verify macOS signing and notarization
        if: matrix.platform == 'darwin' && needs.prepare.outputs.publish == 'true'
        run: node scripts/ci/verify-macos-release.mjs
      - run: node scripts/ci/collect-browser-release.mjs ${{ matrix.platform }} ${{ matrix.arch }} ${{ needs.prepare.outputs.channel }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/${{ matrix.platform }}-${{ matrix.arch }}/
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.channel == 'stable' && 'browser-stable' || 'browser-beta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-artifacts
      - name: Upload verified installers and publish channel feeds
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: node scripts/ci/publish-browser-release.mjs release-artifacts ${{ needs.prepare.outputs.targets }}
