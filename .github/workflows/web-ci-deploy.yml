name: Web checks and deployment
on:
  pull_request:
    paths:
      [
        "apps/web/**",
        ".github/workflows/web-ci-deploy.yml",
        "scripts/ci/deploy-website.mjs",
      ]
  push:
    branches: [main]
    paths:
      [
        "apps/web/**",
        ".github/workflows/web-ci-deploy.yml",
        "scripts/ci/deploy-website.mjs",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Web checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kudium_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d kudium_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/kudium_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run check && bun test
        working-directory: apps/web
      - run: docker build -t kudium-web-check apps/web
  deploy:
    name: Deploy website
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: website-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Skip superseded commits
        id: current
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if test "$latest" = "$GITHUB_SHA"; then echo "deploy=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy checked commit and wait for Coolify
        if: steps.current.outputs.deploy == 'true'
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: node scripts/ci/deploy-website.mjs
