name: Web checks (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Web checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kudium_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d kudium_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/kudium_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run check && bun test
        working-directory: apps/web
      - run: docker build -f apps/web/Dockerfile -t kudium-web-check .
