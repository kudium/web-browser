name: Browser iCloud integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-icloud-integration
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      KUDIUM_ICLOUD_INTEGRATION: "true"
      RELEASE_SIGNING_REQUIRED: "true"
      RELEASE_CHANNEL: beta
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - run: npm install --global npm@12.2.0
      - run: npm ci
        working-directory: apps/browser
      - name: Decode private provisioning profile
        env:
          PROFILE: ${{ secrets.KUDIUM_ICLOUD_PROFILE_BASE64 }}
        run: |
          test -n "$PROFILE" || { echo "::error::Missing CloudKit profile"; exit 1; }
          umask 077
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/kudium.provisionprofile"
          echo "KUDIUM_ICLOUD_PROFILE=$RUNNER_TEMP/kudium.provisionprofile" >> "$GITHUB_ENV"
      - name: Check types and browser tests
        run: ./node_modules/.bin/tsc --noEmit && npm test -- --runInBand --roots src --config .erb/configs/jest.ci.cjs
        working-directory: apps/browser
      - name: Build universal native bridge
        run: |
          ./node_modules/.bin/electron-rebuild -f -w node-pty
          mkdir -p assets/native
          node .erb/scripts/build-cloudkit.cjs assets/native/kudium-cloudkit-bridge.node
          lipo -verify_arch arm64 x86_64 assets/native/kudium-cloudkit-bridge.node
        working-directory: apps/browser
      - name: Set integration installer version
        run: node scripts/ci/prepare-browser-release.mjs v1.0.2-beta.2
      - name: Package signed integration installer
        run: |
          ./node_modules/.bin/ts-node .erb/scripts/clean.js
          npm run build
          ./node_modules/.bin/electron-builder build --config .erb/configs/electron-builder.icloud.cjs --publish never --mac --${{ matrix.arch }}
        working-directory: apps/browser
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify signing and notarization
        run: node scripts/ci/verify-macos-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: icloud-integration-${{ matrix.arch }}
          path: apps/browser/release/build/*.*
          if-no-files-found: error
          retention-days: 14
      - name: Remove provisioning profile
        if: always()
        run: rm -f "$RUNNER_TEMP/kudium.provisionprofile"
