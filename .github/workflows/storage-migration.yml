name: Storage migration contracts
on:
  pull_request:
    paths:
      - 'apps/browser/src/main/**'
      - 'apps/browser/src/__tests__/**'
      - 'apps/browser/.erb/scripts/**'
      - 'apps/browser/docs/releases/**'
      - 'apps/browser/package*.json'
      - '.github/workflows/storage-migration.yml'
  workflow_dispatch:
    inputs:
      native_checks:
        description: Run development OS-storage checks on provisioned native keyring runners
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  contracts:
    name: Unit migration contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run test:migrations
      - run: npx tsc --noEmit
  native-development:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_checks }}
    name: Development OS storage (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macOS, arch: ARM64 }
          - { target: darwin-x64, os: macOS, arch: X64 }
          - { target: win32-x64, os: Windows, arch: X64 }
          - { target: linux-x64, os: Linux, arch: X64 }
    runs-on: [self-hosted, '${{ matrix.os }}', '${{ matrix.arch }}', kudium-migration-keyring]
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run test:migrations:native
